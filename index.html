      // --- 2. STORAGE SERVICE ---
      const STORAGE_KEY = 'floracare_user_plants_v1';
      const API_KEY_KEY = 'floracare_gemini_api_key';

      async function getStoredPlants() {
        try {
          const data = await get(STORAGE_KEY);
          if (data && Array.isArray(data) && data.length > 0) return data;
          await set(STORAGE_KEY, INITIAL_PLANTS);
          return INITIAL_PLANTS;
        } catch (e) {
          const local = localStorage.getItem(STORAGE_KEY);
          if (local) return JSON.parse(local);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_PLANTS));
          return INITIAL_PLANTS;
        }
      }

      async function savePlant(plant) {
        const current = await getStoredPlants();
        const index = current.findIndex(p => p.id === plant.id);
        let updated;
        if (index >= 0) {
          updated = [...current];
          updated[index] = { ...updated[index], ...plant, updatedAt: new Date().toISOString() };
        } else {
          const newP = {
            ...plant,
            id: plant.id || `plant-${Date.now()}`,
            createdAt: new Date().toISOString(),
            lastWatered: plant.lastWatered || new Date().toISOString()
          };
          updated = [newP, ...current];
        }
        try { await set(STORAGE_KEY, updated); } 
        catch(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); }
        return updated;
      }

      async function deletePlant(id) {
        const current = await getStoredPlants();
        const updated = current.filter(p => p.id !== id);
        try { await set(STORAGE_KEY, updated); }
        catch(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); }
        return updated;
      }

      async function markAsWatered(id) {
        const current = await getStoredPlants();
        const updated = current.map(p => p.id === id ? { ...p, lastWatered: new Date().toISOString() } : p);
        try { await set(STORAGE_KEY, updated); }
        catch(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); }
        return updated;
      }

      function saveApiKey(key) {

      // --- 3. GEMINI VISION SERVICE ---
      async function analyzePlantImage(base64Image, apiKey) {
        const cleanBase64 = base64Image.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, '');
        if (apiKey && apiKey.trim()) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const prompt = `Você é um botânico especialista. Analise a imagem da planta e retorne ESTRITAMENTE um JSON com:
{
  "commonName": "Nome popular em português",
  "scientificName": "Nome científico em latim",
  "plantType": "Diurna / Noturna / Sol Pleno / Meia Sombra",
  "watering": { "frequencyDays": 3, "amountMl": "150 - 200 ml", "description": "Como regar" },
  "sunlight": { "period": "Sol da Manhã / Luz Indireta", "hoursPerDay": "4-6h", "habits": "Hábito de sol" },
  "fertilizer": { "type": "NPK ou Orgânico", "frequency": "Periodicidade", "notes": "Dicas" },
  "careTips": ["Dica 1", "Dica 2"]
}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: cleanBase64 } }] }],
                generationConfig: { response_mime_type: 'application/json' }
              })
            });
            const json = await res.json();
            const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
            return JSON.parse(text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim());
          } catch(err) {
            return simulateSmartAi();
          }
        }
        await new Promise(r => setTimeout(r, 2000));
        return simulateSmartAi();
      }

      // PLANT CARD
      function PlantCard({ plant, onWater, onClick }) {
        const lastWateredDate = new Date(plant.lastWatered);
        const freqDays = plant.watering?.frequencyDays || 3;
        const nextWaterDate = new Date(lastWateredDate.getTime() + freqDays * 86400000);
        const now = new Date();
        const diffHours = (nextWaterDate - now) / (1000 * 60 * 60);
        const needsWater = diffHours <= 0;
        const hoursSince = (now - lastWateredDate) / (1000 * 60 * 60);
        const isWateredToday = hoursSince < 14;

        let statusText = isWateredToday ? 'Regada Hoje' : needsWater ? 'Precisa de Água Hoje!' : `Regar em ${Math.ceil(diffHours/24)} dias`;

      // MODAL ADICIONAR PLANTA (CAMERA + UPLOAD + MANUAL)
      function AddPlantModal({ onClose, onSavePlant }) {
        const [photo, setPhoto] = useState(null);
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const [step, setStep] = useState('photo');
        const [formData, setFormData] = useState({
          commonName: '',
          scientificName: '',
          watering: { frequencyDays: 3, amountMl: '150 - 200 ml' },
          sunlight: { period: 'Sol da Manhã / Meia Sombra' },
          fertilizer: { type: 'NPK 10-10-10 ou Húmus' }
        });

        const handleUpload = (e) => {
          const file = e.target.files[0];
          if (file) {
            const r = new FileReader();
            r.onload = () => setPhoto(r.result);
            r.readAsDataURL(file);
          }
        };

        const runAi = async () => {
          if (!photo) return;
          setIsAnalyzing(true);
          const result = await analyzePlantImage(photo, getApiKey());
          setFormData({
            commonName: result.commonName || 'Planta Desconhecida',
            scientificName: result.scientificName || '',
            watering: result.watering || { frequencyDays: 3, amountMl: '150 ml' },
            sunlight: result.sunlight || { period: 'Sol da Manhã' },
            fertilizer: result.fertilizer || { type: 'Adubo Orgânico' }
          });
          setIsAnalyzing(false);
          setStep('form');
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          onSavePlant({ ...formData, photoUrl: photo || 'https://images.unsplash.com/photo-1545241047-6083a3684587?auto=format&fit=crop&w=800&q=80', lastWatered: new Date().toISOString() });
          onClose();
        };

        return React.createElement('div', { className: 'modal-overlay', onClick: onClose },
          React.createElement('div', { className: 'modal-container', onClick: e => e.stopPropagation() },
            React.createElement('div', { className: 'modal-header' },
              React.createElement('span', { className: 'modal-title' }, step === 'photo' ? 'Adicionar Nova Planta' : 'Confirmar & Salvar'),
              React.createElement('button', { className: 'modal-close', onClick: onClose }, React.createElement(X, { size: 20 }))
            ),
            React.createElement('div', { className: 'modal-body' },
              step === 'photo' ? (
                React.createElement('div', null,
                  photo ? (
                    React.createElement('div', null,
                      React.createElement('div', { className: 'preview-img-container' }, React.createElement('img', { src: photo, className: 'preview-img' })),
                      React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' } },
                        React.createElement('button', { className: 'btn btn-secondary', onClick: () => setPhoto(null) }, 'Trocar Foto'),
                        React.createElement('button', { className: 'btn btn-primary', onClick: runAi, disabled: isAnalyzing },
                          isAnalyzing ? 'Analisando...' : 'Analisar com IA Gemini'
                        )
                      ),
                      React.createElement('button', { className: 'btn btn-secondary btn-sm', style: { width: '100%' }, onClick: () => setStep('form') }, 'Preencher Manualmente')
                    )
                  ) : (
                    React.createElement('div', null,
                      React.createElement('label', { className: 'upload-zone', style: { display: 'block' } },
                        React.createElement(Camera, { className: 'upload-icon' }),
                        React.createElement('h4', null, 'Tirar ou Enviar Foto da Planta'),
                        React.createElement('p', { style: { fontSize: '0.85rem', color: 'var(--text-muted)' } }, 'Clique para selecionar foto do celular ou computador'),
                        React.createElement('input', { type: 'file', accept: 'image/*', onChange: handleUpload, style: { display: 'none' } })
                      ),
                      React.createElement('button', { className: 'btn btn-secondary btn-sm', style: { width: '100%', marginTop: '16px' }, onClick: () => setStep('form') }, 'Cadastrar Manualmente sem Foto')
                    )
                  )
                )
              ) : (
                React.createElement('form', { onSubmit: handleSubmit },
                  React.createElement('div', { className: 'form-group' },
                    React.createElement('label', { className: 'form-label' }, 'Nome Popular da Planta *'),
                    React.createElement('input', { className: 'form-input', value: formData.commonName, onChange: e => setFormData({...formData, commonName: e.target.value}), required: true })
                  ),
                  React.createElement('div', { className: 'form-group' },
                    React.createElement('label', { className: 'form-label' }, 'Nome Científico (Botânico)'),
                    React.createElement('input', { className: 'form-input', value: formData.scientificName, onChange: e => setFormData({...formData, scientificName: e.target.value}) })
                  ),
                  React.createElement('div', { style: { display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '20px' } },
                    React.createElement('button', { type: 'button', className: 'btn btn-secondary', onClick: () => setStep('photo') }, 'Voltar'),
                    React.createElement('button', { type: 'submit', className: 'btn btn-primary' }, 'Salvar no Meu Jardim')
                  )
                )
              )
            )
          )
        );
      }

      // MODAL CHAVE API
      function ApiKeyModal({ onClose, onKeySaved }) {
        const [key, setKey] = useState(getApiKey());
        const [showPassword, setShowPassword] = useState(false);
        const [isValidating, setIsValidating] = useState(false);
        const [feedback, setFeedback] = useState(null);

        useEffect(() => {
          const current = getApiKey();
          if (current) {
            setFeedback({ type: 'success', message: 'Chave API configurada e ativa no seu navegador.' });
          }
        }, []);

        const handleValidateAndSave = async (e) => {
          e.preventDefault();
          const trimmed = key.trim();
          if (!trimmed) {
            saveApiKey('');
            setKey('');
            onKeySaved?.(false);
            onClose();
            return;
          }

          setIsValidating(true);
          setFeedback(null);
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${trimmed}`);
            if (!res.ok) {
              throw new Error('Chave de API inválida ou não autorizada pelo Google AI Studio.');
            }
            saveApiKey(trimmed);
            setFeedback({ type: 'success', message: 'Chave válida! Conectada com sucesso ao Gemini 1.5 Flash e pronta para uso.' });
            onKeySaved?.(true);
            setTimeout(() => onClose(), 1600);
          } catch(err) {
            setFeedback({ type: 'error', message: err.message || 'Chave inválida. Verifique os dados no Google AI Studio.' });
          } finally {
            setIsValidating(false);
          }
        };

        const handleRemove = () => {
          saveApiKey('');
          setKey('');
          onKeySaved?.(false);
          setFeedback({ type: 'success', message: 'Chave removida. Modo Simulação reativado.' });
          setTimeout(() => onClose(), 1000);
        };

        return React.createElement('div', { className: 'modal-overlay', onClick: onClose },
          React.createElement('div', { className: 'modal-container', onClick: e => e.stopPropagation(), style: { maxWidth: '500px' } },
            React.createElement('div', { className: 'modal-header' },
              React.createElement('span', { className: 'modal-title', style: { display: 'flex', alignItems: 'center', gap: '8px' } },
                React.createElement(Key, { size: 18, color: 'var(--primary-600)' }),
                'Configurar Chave API Gemini'
              ),
              React.createElement('button', { className: 'modal-close', onClick: onClose }, React.createElement(X, { size: 20 }))
            ),
            React.createElement('div', { className: 'modal-body' },
              React.createElement('p', { style: { fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '14px' } },
                'Insira sua chave do Google AI Studio para análise em tempo real com o Gemini 1.5 Flash.'
              ),
              React.createElement('form', { onSubmit: handleValidateAndSave },
                React.createElement('div', { className: 'form-group' },
                  React.createElement('label', { className: 'form-label', style: { display: 'flex', justifyContent: 'space-between' } },
                    React.createElement('span', null, 'Chave de API Gemini'),
                    React.createElement('a', { href: 'https://aistudio.google.com/app/apikey', target: '_blank', rel: 'noreferrer', style: { fontSize: '0.78rem', color: 'var(--primary-700)', fontWeight: '600' } }, 'Obter grátis ↗')
                  ),
                  React.createElement('div', { style: { position: 'relative' } },
                    React.createElement('input', {
                      type: showPassword ? 'text' : 'password',
                      className: 'form-input',
                      value: key,
                      onChange: e => setKey(e.target.value),
                      placeholder: 'AIzaSy...',
                      style: { paddingRight: '40px' }
                    }),
                    React.createElement('button', {
                      type: 'button',
                      onClick: () => setShowPassword(!showPassword),
                      style: { position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)' }
                    }, showPassword ? '🙈' : '👁️')
                  )
                ),
                feedback && React.createElement('div', {
                  style: {
                    padding: '10px 14px',
                    borderRadius: 'var(--radius-md)',
                    fontSize: '0.825rem',
                    marginBottom: '14px',
                    background: feedback.type === 'success' ? '#ecfdf5' : '#fef2f2',
                    border: `1px solid ${feedback.type === 'success' ? '#a7f3d0' : '#fecaca'}`,
                    color: feedback.type === 'success' ? '#065f46' : '#991b1b'
                  }
                },
                  React.createElement('strong', { style: { display: 'block', marginBottom: '2px' } }, feedback.type === 'success' ? '✅ Chave Válida & Pronta para Uso' : '❌ Falha na Validação'),
                  feedback.message
                ),
                React.createElement('div', { style: { background: 'var(--primary-50)', padding: '10px 12px', borderRadius: 'var(--radius-md)', fontSize: '0.8rem', color: 'var(--text-main)', marginBottom: '16px' } },
                  '🔒 Sua chave é salva exclusivamente no seu navegador. Sem chave, o app funciona no Modo Simulado.'
                ),
                React.createElement('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: '8px', flexWrap: 'wrap' } },
                  getApiKey() && React.createElement('button', { type: 'button', className: 'btn btn-secondary', onClick: handleRemove, style: { color: 'var(--accent-danger)' }, disabled: isValidating }, 'Remover'),
                  React.createElement('button', { type: 'button', className: 'btn btn-secondary', onClick: onClose, disabled: isValidating }, 'Cancelar'),
                  React.createElement('button', { type: 'submit', className: 'btn btn-primary', disabled: isValidating },
                    isValidating ? 'Validando...' : (feedback?.type === 'success' ? 'Chave Pronta!' : 'Validar & Salvar')
                  )
                )
              )
            )
          )
        );
      }

      // MAIN APP COMPONENT
      function App() {
        const [plants, setPlants] = useState([]);
        const [searchTerm, setSearchTerm] = useState('');
        const [activeFilter, setActiveFilter] = useState('all');
        const [selectedPlant, setSelectedPlant] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [showKeyModal, setShowKeyModal] = useState(false);
        const [hasApiKey, setHasApiKey] = useState(Boolean(getApiKey()));

        useEffect(() => {
          getStoredPlants().then(setPlants);
          setHasApiKey(Boolean(getApiKey()));
        }, []);

        const handleWater = async (id) => {
          const updated = await markAsWatered(id);
          setPlants(updated);
          confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
        };

        const handleSave = async (p) => {
          const updated = await savePlant(p);
          setPlants(updated);
        };

        const handleDelete = async (id) => {
          const updated = await deletePlant(id);
          setPlants(updated);
        };

        const now = new Date();
        const needsWaterCount = plants.filter(p => {
          const diff = (now - new Date(p.lastWatered)) / (1000 * 60 * 60);
          return diff >= ((p.watering?.frequencyDays || 3) * 24 - 12);
        }).length;

        const filtered = plants.filter(p => {
          const matches = p.commonName.toLowerCase().includes(searchTerm.toLowerCase()) || 
            (p.scientificName && p.scientificName.toLowerCase().includes(searchTerm.toLowerCase()));
          if (!matches) return false;
          if (activeFilter === 'needs_water') {
            const diff = (now - new Date(p.lastWatered)) / (1000 * 60 * 60);
            return diff >= ((p.watering?.frequencyDays || 3) * 24 - 12);
          }
          return true;
        });

        return React.createElement('div', null,
          React.createElement(Navbar, {
            hasApiKey: hasApiKey,
            onAddClick: () => setShowAddModal(true),
            onOpenKeyModal: () => setShowKeyModal(true)
          }),
          React.createElement('main', { className: 'app-container' },
            React.createElement('section', { className: 'hero-header' },
              React.createElement('div', { className: 'hero-text' },
                React.createElement('h1', null, 'Meu Jardim Inteligente 🌿'),
                React.createElement('p', null, 'Acompanhe a rotina de rega e cuide das suas plantas com apoio da IA.')
              ),
              React.createElement('div', { className: 'stats-grid' },
                React.createElement('div', { className: 'stat-card' },
                  React.createElement('div', { className: 'stat-value' }, plants.length),
                  React.createElement('div', { className: 'stat-label' }, 'Plantas')
                ),
                React.createElement('div', { className: 'stat-card', style: { background: needsWaterCount > 0 ? 'rgba(239, 68, 68, 0.25)' : undefined } },
                  React.createElement('div', { className: 'stat-value', style: { color: needsWaterCount > 0 ? '#fca5a5' : '#fff' } }, needsWaterCount),
                  React.createElement('div', { className: 'stat-label' }, 'Regar Hoje')
                )
              )
            ),
            React.createElement('section', { className: 'toolbar' },
              React.createElement('div', { className: 'search-box' },
                React.createElement(Search, { className: 'search-icon', size: 18 }),
                React.createElement('input', {
                  type: 'text',
                  placeholder: 'Buscar por nome popular ou científico...',
                  value: searchTerm,
                  onChange: e => setSearchTerm(e.target.value)
                })
              ),
              React.createElement('div', { className: 'filter-chips' },
                React.createElement('button', { className: `chip ${activeFilter === 'all' ? 'active' : ''}`, onClick: () => setActiveFilter('all') }, `Todas (${plants.length})`),
                React.createElement('button', { className: `chip ${activeFilter === 'needs_water' ? 'active' : ''}`, onClick: () => setActiveFilter('needs_water') }, `Precisa de Água (${needsWaterCount})`)
              )
            ),
            React.createElement('div', { className: 'plant-grid' },
              filtered.map(p => React.createElement(PlantCard, { key: p.id, plant: p, onWater: handleWater, onClick: setSelectedPlant }))
            )
          ),
          selectedPlant && React.createElement(PlantDetailModal, { plant: selectedPlant, onClose: () => setSelectedPlant(null), onSave: handleSave, onDelete: handleDelete, onWater: handleWater }),
          showAddModal && React.createElement(AddPlantModal, { onClose: () => setShowAddModal(false), onSavePlant: handleSave }),
          showKeyModal && React.createElement(ApiKeyModal, { onClose: () => setShowKeyModal(false), onKeySaved: (hasKey) => setHasApiKey(hasKey) })
        );
      }

      // RENDER APP
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
